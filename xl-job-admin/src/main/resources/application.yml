server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:33060/xl_job?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: changeit

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

xl:
  job:
    admin:
      # 调度中心心跳超时时间(秒)
      heartbeat-timeout: 90
      # 注册表清理间隔(秒)
      registry-clean-interval: 30

logging:
  level:
    com.xl.job: DEBUG
